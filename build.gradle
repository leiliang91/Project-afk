plugins {
    id 'java'
}

version '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation  group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.10.2'
    implementation  group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.10.2'
    implementation  group: 'net.java.dev.jna', name: 'jna', version: '5.5.0'
    implementation  group: 'net.java.dev.jna', name: 'jna-platform', version: '5.5.0'
    testImplementation  group: 'junit', name: 'junit', version: '4.12'
}

def mainClassName = "csgo.CSGOService"

jar {
    manifest {
        attributes(
                'Main-Class': mainClassName
        )
    }

    archiveBaseName  = 'CSGO'
    
    from {
        configurations.compile.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}